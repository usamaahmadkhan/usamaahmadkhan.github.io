<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8" />
  <script src="/assets/js/theme-init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog — Usama Ahmad</title>
  <meta name="description" content="Notes on infrastructure engineering, Kubernetes, and platform work — Usama Ahmad." />
  <link rel="canonical" href="https://usamaahmadkhan.dev/blog/" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/assets/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/jbmono-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<nav class="nav" aria-label="Primary">
  <div class="nav__inner shell">
    <a class="nav__brand" href="/">usama<span class="muted">@</span>Infrastructure.engineer<span class="cursor" aria-hidden="true">_</span></a>
    <div class="nav__links" style="margin-left:auto">
      <a href="/">Home</a>
      <a href="/resume/">Resume</a>
    </div>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
      <svg class="theme-toggle__dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
      <svg class="theme-toggle__light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </div>
</nav>

<main id="main" class="shell" style="padding-top:calc(var(--nav-h) + 2.5rem);padding-bottom:4rem">
  <div class="section-head">
    <h2>blog<span class="cursor" aria-hidden="true">_</span></h2>
    <span class="meta">{{count}}</span>
  </div>

  <div class="posts">
{{posts}}
  </div>
</main>

<div class="audio-widget" data-audio-widget>
  <button class="audio-widget__toggle" type="button" data-audio-toggle aria-pressed="false" aria-label="Toggle background audio">
    <span class="audio-widget__bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
  <input class="audio-widget__volume" type="range" min="0" max="100" value="35" data-audio-volume aria-label="Background audio volume" />
</div>

<script src="/assets/js/site.js"></script>
</body>
</html>
