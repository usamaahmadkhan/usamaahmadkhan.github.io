name: Sync training data

# D25 / PLAN.md V2-A. Needs a CALIBER_REFRESH_TOKEN repo secret — obtain it by
# running `node scripts/caliber-auth.mjs` locally once (Caliber uses OAuth, not
# an API key). Until then this fails loudly rather than silently writing
# nothing, which is intended: a red run is the signal it isn't wired up yet.
# The site hides the Training section when the snapshot is missing or stale, so
# a failed sync never breaks the published page.

on:
  # Schedule is deliberately disabled: no data source is wired up, so a nightly
  # run would just fail every day and mail about it. Re-enable by uncommenting
  # once a provider is chosen (PLAN.md V2-A).
  # schedule:
  #   - cron: '0 22 * * *' # 22:00 UTC = 03:00 Asia/Karachi (UTC+5, no DST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch + write snapshot
        env:
          CALIBER_REFRESH_TOKEN: ${{ secrets.CALIBER_REFRESH_TOKEN }}
        run: node scripts/sync-training.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/assets/data/training.json; then
            git add src/assets/data/training.json
            git commit -m "chore: sync training data"
            git push
          else
            echo "no change"
          fi
